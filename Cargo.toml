[package]
name = "bilore-monitor"
version = "0.1.0"
edition = "2021"

[lib]
name = "bilore_monitor"
path = "src/lib.rs"

[[bin]]
name = "bilore-monitor"
path = "src/main.rs"

[dependencies]
bilore-core = { path = "../bilore-core" }
bilore-backtest = { path = "../bilore-backtest" }

tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "rust_decimal"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde-with-str"] }
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
